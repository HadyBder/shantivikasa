name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: choco install nsis --yes --no-progress
      - run: python scripts/build-windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: ShantiVikasa-Windows
          path: release/ShantiVikasa-Setup-*.exe
